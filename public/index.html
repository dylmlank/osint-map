<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OSINT Map</title>
  <script>
    // Start downloading everything this visit will need right away, in parallel with the map
    // libraries below: the data for layers that are switched on, and the right basemap.
    (function () {
      var on = { flights: 1, cameras: 1, news: 1, quakes: 1 };
      var basemap = 'dark';
      try {
        var saved = JSON.parse(localStorage.getItem('osint-layers')); if (saved) on = saved;
        basemap = JSON.parse(localStorage.getItem('osint-basemap')) || 'dark';
      } catch (e) {}
      var feeds = ['military', 'cameras', 'news', 'quakes', 'fires', 'events', 'alerts', 'cables', 'plants', 'sanctioned', 'dark', 'jamming'];
      window.prefetch = {};
      feeds.forEach(function (f) {
        if (on[f]) window.prefetch[f] = fetch('/api/' + f).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
      });
      var hint = function (rel, href, as) {
        var l = document.createElement('link'); l.rel = rel; l.href = href; if (as) l.as = as;
        if (as !== 'script') l.crossOrigin = 'anonymous'; // scripts are loaded without CORS, so the preload must match
        document.head.appendChild(l);
      };
      if (basemap === 'satellite') {
        hint('preconnect', 'https://server.arcgisonline.com');
      } else {
        hint('preconnect', 'https://tiles.basemaps.cartocdn.com');
        hint('preload', 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json', 'fetch');
      }
      if (on.satellites || on.starlink) hint('preload', 'https://unpkg.com/satellite.js@5.0.0/dist/satellite.min.js', 'script');
      // Keep libraries and map tiles on this computer for fast repeat visits.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
      }
    })();
  </script>
  <link rel="preload" as="script" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js">
  <link rel="preload" as="script" href="https://unpkg.com/deck.gl@9.0.38/dist.min.js">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div id="map"></div>

  <aside id="panel">
    <header>
      <h1>OSINT<span>MAP</span></h1>
      <div class="live mono"><i id="live-dot"></i><span id="clock"></span></div>
    </header>
    <div class="search">
      <input id="search" type="search" placeholder="Search place, flight, ship, camera…" autocomplete="off" spellcheck="false">
      <div id="results" hidden></div>
    </div>
    <div class="basemap" role="radiogroup" aria-label="Map style">
      <button data-basemap="dark" role="radio">Dark map</button>
      <button data-basemap="satellite" role="radio">Satellite</button>    </div>
    <section class="watch">
      <div class="watch-head">
        <span class="group">Watchlist</span>
        <button id="watch-area" title="Draw an area on the map to watch">+ Area</button>
        <button id="alerts-btn" title="Alert history">Alerts <b id="unread" hidden>0</b></button>
      </div>
      <div id="watch-list"><p class="empty">Nothing watched yet. Draw an area, or open a flight or ship and press Watch.</p></div>
    </section>
    <div id="layers"></div>
    <details class="key">
      <summary>Color key</summary>
      <div id="legend" class="legend"></div>
    </details>
    <p id="status" class="mono"></p>
    <p class="sources">Sources: adsb.lol · aisstream.io · Caltrans · GDELT · USGS · NASA EONET · NIFC · NWS · RainViewer · TeleGeography · WRI · Esri · OpenStreetMap</p>
  </aside>

  <div id="toasts" aria-live="polite"></div>

  <div id="timeline">
    <button id="tl-live" class="on" title="Back to live">● LIVE</button>
    <button id="tl-play" title="Play / pause">▶</button>
    <select id="tl-speed" title="Playback speed">
      <option value="60">1 min/s</option>
      <option value="300" selected>5 min/s</option>
      <option value="1800">30 min/s</option>
    </select>
    <div class="tl-track">
      <input type="range" id="tl-slider" min="0" max="1000" value="1000" aria-label="Time">
      <div id="tl-ticks"></div>
    </div>
    <span id="tl-label" class="mono">Live</span>
  </div>

  <article id="card" hidden>
    <button id="card-close" aria-label="Close">×</button>
    <div id="card-body"></div>
  </article>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/deck.gl@9.0.38/dist.min.js"></script>
  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
